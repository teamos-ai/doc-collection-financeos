ting the relevant progress payment.",tag:"fos-doc-needed-builder-invoice",key:"builder-invoice"},{number:69,group:"Construction",label:"Stage inspection evidence",description:"Inspection or valuation evidence for the relevant construction stage.",tag:"fos-doc-needed-stage-inspection",key:"stage-inspection"},{number:70,group:"Construction",label:"Completion evidence",description:"Completion or occupancy evidence for the relevant final stage.",tag:"fos-doc-needed-completion-evidence",key:"completion-evidence"}],U2=[{id:"CBA",name:"CommBank · application checklist",url:"https://www.commbank.com.au/home-loans/applying-for-a-home-loan.html",date:"Web page checked 19 Nov 2026",status:"Primary source",finding:"Salary-credit evidence distinguishes three months from six for casual employment. Self-employed evidence and rental alternatives vary. This supports conditional requests, not a blanket bank-statement pack."},{id:"ANZ",name:"ANZ · home loan checklist",url:"https://www.anz.com.au/personal/home-loans/get-started/checklist/",date:"Web page checked 19 Nov 2026 · excludes ANZ Plus",status:"Primary source",finding:"PAYG evidence depends on YTD history. Recent payslips may be up to 60 days old. Self-employed routes include one-year evidence or eligible company wages. Home-loan statements are generally unnecessary, with exceptions. Signed contracts come after approval-in-principle."},{id:"NAB",name:"NAB · application, page 2",url:"https://www.nab.com.au/content/dam/nabrwd/documents/forms/loans/home-loan-application-form.pdf",date:"Document 79936A-0725 · July 2025 · checked 19 Nov 2026",status:"Dated primary PDF",finding:"Refinanced loans: six months of transactions, evidence no older than 90 days. PAYG alternatives include one YTD payslip or two of the last three, usually within 45 days; longer pay cycles differ. This separates history, quantity and freshness."},{id:"WBC",name:"Westpac · self-employed broker guide",url:"https://www.westpac.com.au/brokers/ideas-hub/self-employed/",date:"Web page checked 19 Nov 2026",status:"Primary source",finding:"Separate eligible Fast Track, one-year and standard two-year routes. Fast Track uses two personal ATO notices of assessment. Other routes can require entity financials. Do not silently put excluded standalone financials back into the collection catalogue."},{id:"ING",name:"ING · mortgage application checklist",url:"https://www.ing.com.au/pdf/application_checklist.pdf",date:"Historical 2017 checklist · re-located 19 Nov 2026",status:"Historical only",finding:"Useful Australian naming and older six-month loan / three-month card refinance references. Not accepted as current policy. Current initial broker requirements remain a gap. ING-V is a newer variation form, not a replacement initial-application checklist."},{id:"ATO-I",name:"ATO · income statements",url:"https://www.ato.gov.au/individuals-and-families/jobs-and-employment-types/working-as-an-employee/income-statements/access-your-income-statement",date:"Checked 19 Nov 2026",status:"Terminology authority",finding:"Use ATO income statement. A PAYG payment summary is an alternative employer reporting document, not a tax return or notice of assessment. Keep the actual evidence route on the request."},{id:"ATO-N",name:"ATO · notice of assessment",url:"https://www.ato.gov.au/individuals-and-families/your-tax-return/your-notice-of-assessment",date:"Checked 19 Nov 2026",status:"Terminology authority",finding:"The notice of assessment is the ATO assessment following a tax return. Request the correct financial year and keep it distinct from both the return and the ATO account statement."},{id:"HG",name:"Hunter Galloway · supplied checklist",url:"https://www.huntergalloway.com.au/",date:"Local one-page PDF read 19 Nov 2026 · publication date unknown",status:"Broker comparison",finding:"Compares common income, savings, liabilities and property evidence. Its three-year self-employed / six-month savings suggestions differ from the proposed baseline. Use as gap discovery, not lender policy. Original file is recorded in the research handoff."},{id:"AUSSIE",name:"Aussie · supplied refinance checklist",url:"https://www.aussie.com.au/",date:"Local one-page PDF ©2021 read 19 Nov 2026",status:"Historical comparison",finding:"Separates refinance purpose, existing debts, income and rates notices. Its older “Group Certificates” wording maps to the appropriate ATO income statement / PAYG payment summary route. Expense evidence stays outside this module."},{id:"ANZ-C",name:"ANZ · supplied construction checklist",url:"https://www.anz.com.au/content/dam/anzcomau/documents/pdf/construction-loan-checklist.pdf",date:"Local PDF 08.2022; internally current at 29 Apr 2020",status:"Historical stage comparison",finding:"Deposit, progress and final draw evidence differ. Use it to justify a construction-stage input; do not import historical payment lead times or request final-stage evidence at initial application."},{id:"WBC-26",name:"Westpac · broker minimum documents",url:"https://www.westpac.com.au/content/dam/public/brokers/documents/applications/wbc-minimum-required-documents-checklist.pdf",date:"WBC22133 0226 · February 2026 · checked 20 Nov 2026",status:"Broker PDF · channel-specific",finding:"Pages 1, 3–8: TFN removal, PAYG alternatives, CCR-based liability/refinance evidence, staged building documents. Exceptions still refer to credit policy; a waiver is not automatic."},{id:"ING-V",name:"ING · existing home-loan variation",url:"https://www.ing.com.au/pdf/HomeLoans/Variation/VariationFormG.pdf",date:"IM450 12/25 · December 2025 · checked 20 Nov 2026",status:"Existing-loan variations only",finding:"Pages 1/10/19: applies to existing ING loan changes; applicable Section I uses a payslip under one month and salary-credit evidence if ABN is absent. Closure Yes/No is an election, not proof of a universal closure-letter requirement."},{id:"CBA-S",name:"CommBank · statement issue frequency",url:"https://www.commbank.com.au/home-loans/guide-to-statements.html",date:"Checked 20 Nov 2026",status:"Primary source",finding:"Home-loan statements issue in January and July. Request date coverage, not six monthly files. A statement closing balance is not a payout figure."},{id:"HLE-S",name:"Home Loan Experts · statements guide",url:"https://www.homeloanexperts.com.au/home-loan-documents/statements-transaction-histories/",date:"Checked 20 Nov 2026 · publication date not independently established",status:"Broker practice, not universal policy",finding:"Distinguishes official statements from transaction histories and recommends pairing when ownership details/history are missing. Its CSV restriction is broker guidance, not a verified all-lender upload-format ban."},{id:"ATO-D",name:"ATO · definitions",url:"https://www.ato.gov.au/Definitions/?anchor=P789-67151",date:"Official indexed definition checked 20 Nov 2026; direct page returned 403",status:"Official indexed terminology",finding:"IAS is similar to BAS but excludes GST and some other taxes. BAS, IAS and ATO account ledgers are not aliases; only BAS remains in this catalogue."},{id:"ATO-STP",name:"ATO · finalising STP data",url:"https://www.ato.gov.au/businesses-and-organisations/hiring-and-paying-your-workers/single-touch-payroll/finalising-your-stp-data",date:"Official indexed guidance checked 20 Nov 2026",status:"Terminology authority",finding:"Payment summaries remain relevant for payments not reported/finalised through STP. Keep completed-year finalisation distinct from current YTD evidence; do not require an unfinished financial year to be Tax ready."},{id:"WBC-P",name:"Westpac · public broker policy",url:"https://www.westpac.com.au/brokers/policy/",date:"Checked 20 Nov 2026",status:"Conflicting public guidance",finding:"The page mentions both three and six months of rental history for genuine savings. Keep this purpose separate from landlord rental income; resolve the applicable route before issue."},{id:"ANZ-P",name:"ANZ · paper application",url:"https://www.anz.com.au/content/dam/anzcomau/documents/pdf/home-loan-application-form.pdf",date:"Page 2 · checked 20 Nov 2026",status:"Channel-specific form",finding:"Lists three months of home-loan statements if applicable. The web checklist generally does not require them. Do not erase this conditional channel difference."},{id:"ANZ-D",name:"ANZ · general documents guide",url:"https://www.anz.com.au/personal/home-loans/get-started/documents-home-loan-application/",date:"Checked 20 Nov 2026",status:"General guide / differing freshness",finding:"Mentions self-employed tax evidence under 18 months; the detailed checklist uses different limits. No universal tax-age cutoff is adopted."},{id:"CBA-B",name:"CommBank · business-owner verification",url:"https://www.commbank.com.au/business/home-loans.html",date:"Checked 20 Nov 2026",status:"Primary source · eligible routes",finding:"Simplified verification pairs salary evidence with business-profit evidence or an accepted accountant letter. It is not the same as ANZ’s company-wage route or Westpac’s NOA-only route."}],Q2=[{id:"R01",scenario:"Home loan being refinanced",documents:"Home loan statements",period:"6 continuous months",quantity:"Enough non-overlapping evidence for the dates; a matching transaction listing may bridge a statement gap where accepted",freshness:"Proposed: latest evidence within 90 days; lender check",condition:"Per refinanced account; retained loans use a separate rule.",basis:"Founder standard",sources:["NAB","ANZ","WBC-26","CBA-S"]},{id:"R02",scenario:"Credit card consolidated into home loan",documents:"Credit card statements",period:"6 continuous months",quantity:"Enough statements to cover the period",freshness:"Latest available; exact cutoff unresolved",condition:"Only cards explicitly marked Consolidated.",basis:"Founder standard",sources:[]},{id:"R03",scenario:"Credit card retained / conduct check",documents:"Credit card statements",period:"3 continuous months",quantity:"Enough statements to cover
