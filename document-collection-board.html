ngs history",description:"Evidence covering the specified savings history.",tag:"fos-doc-needed-savings-history",key:"savings-history"},{number:55,group:"Deposit and funds",label:"Gift declaration",description:"Gift declaration or selected lender gift form.",tag:"fos-doc-needed-gift-declaration",key:"gift-declaration"},{number:56,group:"Deposit and funds",label:"Contract of sale — selling",description:"Contract for a property or asset being sold to contribute funds.",tag:"fos-doc-needed-sale-contract",key:"sale-contract"},{number:57,group:"Property transaction",label:"Contract of sale — buying",description:"Contract for the property being purchased.",tag:"fos-doc-needed-purchase-contract",key:"purchase-contract"},{number:58,group:"Property transaction",label:"Contract amendments",description:"Variations or amendments to the purchase contract.",tag:"fos-doc-needed-contract-amendments",key:"contract-amendments"},{number:59,group:"Property transaction",label:"Conveyancer details",description:"Solicitor or conveyancer details; information entry rather than mandatory file upload.",tag:"fos-doc-needed-conveyancer-details",key:"conveyancer-details"},{number:60,group:"Property transaction",label:"First home buyer documents",description:"Placeholder for scheme-specific requests; exact items must be defined before activation.",tag:"fos-doc-needed-first-home-buyer",key:"first-home-buyer"},{number:61,group:"Construction",label:"Building contract",description:"Tender/draft at the selected pre-approval stage or signed contract where required for the current stage; lender route must be confirmed.",tag:"fos-doc-needed-building-contract",key:"building-contract"},{number:62,group:"Construction",label:"Progress payment schedule",description:"Agreed construction draw or progress-payment schedule.",tag:"fos-doc-needed-progress-schedule",key:"progress-schedule"},{number:63,group:"Construction",label:"Building plans",description:"Plans for the relevant project and revision.",tag:"fos-doc-needed-building-plans",key:"building-plans"},{number:64,group:"Construction",label:"Building specifications",description:"Specifications describing the proposed build.",tag:"fos-doc-needed-building-specifications",key:"building-specifications"},{number:65,group:"Construction",label:"Building approvals",description:"Applicable project approvals or permits.",tag:"fos-doc-needed-building-approvals",key:"building-approvals"},{number:66,group:"Construction",label:"Construction insurance",description:"Required builder or construction insurance evidence.",tag:"fos-doc-needed-construction-insurance",key:"construction-insurance"},{number:67,group:"Construction",label:"Progress payment claim",description:"Claim or instruction for the relevant construction draw.",tag:"fos-doc-needed-progress-claim",key:"progress-claim"},{number:68,group:"Construction",label:"Builder invoice",description:"Invoice supporting the relevant progress payment.",tag:"fos-doc-needed-builder-invoice",key:"builder-invoice"},{number:69,group:"Construction",label:"Stage inspection evidence",description:"Inspection or valuation evidence for the relevant construction stage.",tag:"fos-doc-needed-stage-inspection",key:"stage-inspection"},{number:70,group:"Construction",label:"Completion evidence",description:"Completion or occupancy evidence for the relevant final stage.",tag:"fos-doc-needed-completion-evidence",key:"completion-evidence"}],XE=[{id:"CBA",name:"CommBank · application checklist",url:"https://www.commbank.com.au/home-loans/applying-for-a-home-loan.html",date:"Web page checked 19 Nov 2026",status:"Primary source",finding:"Salary-credit evidence distinguishes three months from six for casual employment. Self-employed evidence and rental alternatives vary. This supports conditional requests, not a blanket bank-statement pack."},{id:"ANZ",name:"ANZ · home loan checklist",url:"https://www.anz.com.au/personal/home-loans/get-started/checklist/",date:"Web page checked 19 Nov 2026 · excludes ANZ Plus",status:"Primary source",finding:"PAYG evidence depends on YTD history. Recent payslips may be up to 60 days old. Self-employed routes include one-year evidence or eligible company wages. Home-loan statements are generally unnecessary, with exceptions. Signed contracts come after approval-in-principle."},{id:"NAB",name:"NAB · application, page 2",url:"https://www.nab.com.au/content/dam/nabrwd/documents/forms/loans/home-loan-application-form.pdf",date:"Document 79936A-0725 · July 2025 · checked 19 Nov 2026",status:"Dated primary PDF",finding:"Refinanced loans: six months of transactions, evidence no older than 90 days. PAYG alternatives include one YTD payslip or two of the last three, usually within 45 days; longer pay cycles differ. This separates history, quantity and freshness."},{id:"WBC",name:"Westpac · self-employed broker guide",url:"https://www.westpac.com.au/brokers/ideas-hub/self-employed/",date:"Web page checked 19 Nov 2026",status:"Primary source",finding:"Separate eligible Fast Track, one-year and standard two-year routes. Fast Track uses two personal ATO notices of assessment. Other routes can require entity financials. Do not silently put excluded standalone financials back into the collection catalogue."},{id:"ING",name:"ING · mortgage application checklist",url:"https://www.ing.com.au/pdf/application_checklist.pdf",date:"Historical 2017 checklist · re-located 19 Nov 2026",status:"Historical only",finding:"Useful Australian naming and older six-month loan / three-month card refinance references. Not accepted as current policy. Current initial broker requirements remain a gap. ING-V is a newer variation form, not a replacement initial-application checklist."},{id:"ATO-I",name:"ATO · income statements",url:"https://www.ato.gov.au/individuals-and-families/jobs-and-employment-types/working-as-an-employee/income-statements/access-your-income-statement",date:"Checked 19 Nov 2026",status:"Terminology authority",finding:"Use ATO income statement. A PAYG payment summary is an alternative employer reporting document, not a tax return or notice of assessment. Keep the actual evidence route on the request."},{id:"ATO-N",name:"ATO · notice of assessment",url:"https://www.ato.gov.au/individuals-and-families/your-tax-return/your-notice-of-assessment",date:"Checked 19 Nov 2026",status:"Terminology authority",finding:"The notice of assessment is the ATO assessment following a tax return. Request the correct financial year and keep it distinct from both the return and the ATO account statement."},{id:"HG",name:"Hunter Galloway · supplied checklist",url:"https://www.huntergalloway.com.au/",date:"Local one-page PDF read 19 Nov 2026 · publication date unknown",status:"Broker comparison",finding:"Compares common income, savings, liabilities and property evidence. Its three-year self-employed / six-month savings suggestions differ from the proposed baseline. Use as gap discovery, not lender policy. Original file is recorded in the research handoff."},{id:"AUSSIE",name:"Aussie · supplied refinance checklist",url:"https://www.aussie.com.au/",date:"Local one-page PDF ©2021 read 19 Nov 2026",status:"Historical comparison",finding:"Separates refinance purpose, existing debts, income and rates notices. Its older “Group Certificates” wording maps to the appropriate ATO income statement / PAYG payment summary route. Expense evidence stays outside this module."},{id:"ANZ-C",name:"ANZ · supplied construction checklist",url:"https://www.anz.com.au/content/dam/anzcomau/documents/pdf/construction-loan-checklist.pdf",date:"Local PDF 08.2022; internally current at 29 Apr 2020",status:"Historical stage comparison",finding:"Deposit, progress and final draw evidence differ. Use it to justify a construction-stage input; do not import historical payment lead times or request final-stage evidence at initial application."},{id:"WBC-26",name:"Westpac · broker minimum documents",url:"https://www.westpac.com.au/content/dam/public/brokers/documents/applications/wbc-minimum-required-documents-checklist.pdf",date:"WBC22133 0226 · February 2026 · checked 20 Nov 2026",status:"Broker PDF · channel-specific",finding:"Pages 1, 3–8: TFN removal, PAYG alternatives, CCR-based liability/refinance evidence, staged building documents. Exceptions still refer to credit policy; a waiver is not automatic."},{id:"ING-V",name:"ING · existing home-loan variation",url:"https://www.ing.com.au/pdf/HomeLoans/Variation/VariationFormG.pdf",date:"IM450 12/25 · December 2025 · checked 20 Nov 2026",status:"Existing-loan variations only",finding:"Pages 1/10/19: applies to existing ING loan changes; applicable Section I uses a payslip under one month and salary-credit evidence if ABN is absent. Closure Yes/No is an election, not proof of a universal closure-letter requirement."},{id:"CBA-S",name:"CommBank · statement issue frequency",url:"https://www.commbank.com.au/home-loans/guide-to-statements.html",date:"Checked 20 Nov 2026",status:"Primary source",finding:"Home-loan statements issue in January and July. Request date coverage, not six monthly files. A statement closing balance is not a payout figure."},{id:"HLE-S",name:"Home Loan Experts · statements guide",url:"https://www.homeloanexperts.com.au/home-loan-documents/statements-transaction-histories/",date:"Checked 20 Nov 2026 · publication date not independently established",status:"Broker practice, not universal policy",finding:"Distinguishes official statements from transaction histories and recommends pairing when ownership details/history are missing. Its CSV restriction is broker guidance, not a verified all-lender upload-format ban."},{id:"ATO-D",name:"ATO · definitions",url:"https://www.ato.gov.au/Definitions/?anchor=P789-67151",date:"Official indexed definition checked 20 Nov 2026; direct page returned 403",status:"Official indexed terminology",finding:"IAS is similar to BAS but excludes GST and some other taxes. BAS, IAS and ATO account ledgers are not aliases; only BAS remains in this catalogue."},{id:"ATO-STP",name:"ATO · finalising STP data",url:"https://www.ato.gov.au/businesses-and-organisations/hiring-and-paying-your-workers/single-touch-payroll/finalising-your-stp-data",date:"Official indexed guidance checked 20 Nov 2026",status:"Terminology authority",finding:"Payment summaries remain relevant for payments not reported/finalised through STP. Keep completed-year finalisation distinct from current YTD evidence; do not require an unfinished financial year to be Tax ready."},{id:"WBC-P",name:"Westpac · public broker policy",url:"https://www.westpac.com.au/brokers/policy/",date:"Checked 20 Nov 2026",status:"Conflicting public guidance",finding:"The page mentions both three and six months of rental history for genuine savings. Keep this purpose separate from landlord rental income; resolve the applicable route before issue."},{id:"ANZ-P",name:"ANZ · paper application",url:"https://www.anz.com.au/content/dam/anzcomau/documents/pdf/home-loan-application-form.pdf",date:"Page 2 · checked 20 Nov 2026",status:"Channel-specific form",finding:"Lists three months of home-loan statements if applicable. The web checklist generally does not require them. Do not erase this conditional channel difference."},{id:"ANZ-D",name:"ANZ · general documents guide",url:"https://www.anz.com.au/personal/home-loans/get-started/documents-home-loan-application/",date:"Checked 20 Nov 2026",status:"General guide / differing freshness",finding:"Mentions self-employed tax evidence under 18 months; the detailed checklist uses different limits. No universal tax-age cutoff is adopted."},{id:"CBA-B",name:"CommBank · business-owner verification",url:"https://www.commbank.com.au/business/home-loans.html",date:"Checked 20 Nov 2026",status:"Primary source · eligible routes",finding:"Simplified verification pairs salary evidence with business-profit evidence or an accepted accountant letter. It is not the same as ANZ’s company-wage route or Westpac’s NOA-only route."}],ZE=[{id:"R01",scenario:"Home loan being refinanced",documents:"Home loan statements",period:"6 continuous months",quantity:"Enough non-overlapping evidence for the dates; a matching transaction listing may bridge a statement gap where accepted",freshness:"Proposed: latest evidence within 90 days; lender check",condition:"Per refinanced account; retained loans use a separate rule.",basis:"Founder standard",sources:["NAB","ANZ","WBC-26","CBA-S"]},{id:"R02",scenario:"Credit card consolidated into home loan",documents:"Credit card statements",period:"6 continuous months",quantity:"Enough statements to cover the period",freshness:"Latest available; exact cutoff unresolved",condition:"Only cards explicitly marked Consolidated.",basis:"Founder standard",sources:[]},{id:"R03",scenario:"Credit card retained / conduct check",documents:"Credit card statements",period:"3 continuous months",quantity:"Enough statements to cover the period",freshness:"Latest available; exact cutoff unresolved",condition:"Per retained card. Never inherit another card’s treatment.",basis:"Founder standard",sources:[]},{id:"R04",scenario:"Permanent PAYG income",documents:"Payslips",period:"Current pay cycles",quantity:"Proposed: 2 consecutive payslips",freshness:"Proposed: latest within 30 days",condition:"Employer and YTD details matter. Lender alternatives may reduce the pack; not a universal two-slip rule.",basis:"Proposed",sources:["NAB","ANZ","CBA"]},{id:"R05",scenario:"Casual PAYG income",documents:"Payslips; ATO income statement if history is insufficient",period:"Proposed: establish 6 months income history",quantity:"2 latest payslips plus only the missing history",freshness:"Payslip cutoff proposed; history supplement per selected route",condition:"If YTD establishes history, do not request duplicate historical evidence automatically.",basis:"Proposed",sources:["ANZ"]},{id:"R06",scenario:"Salary credits need matching",documents:"Salary bank statements",period:"Proposed: 3 months permanent / 6 months casual",quantity:"Enough statements for salary-credit coverage",freshness:"Latest available; cutoff to approve",condition:"Explicit matching need only. Match net payslip amounts and payment dates; no general transaction-account chase.",basis:"Proposed",sources:["CBA","ANZ"]},{id:"R07",scenario:"Sole trader standard income route",documents:"Personal tax returns + ATO notices of assessment",period:"Proposed: 2 latest lodged financial years",quantity:"One return and assessment per selected year",freshness:"Specify FY; lender age limits vary",condition:"Generate only after selecting the standard route. Review first generates no tax pack; a reduced-document route must not stack this pack.",basis:"Proposed",sources:["CBA","NAB","ANZ"]},{id:"R08",scenario:"Company profits relied upon",documents:"Personal tax returns / NOAs + business tax returns",period:"Proposed: 2 latest lodged financial years",quantity:"Per person and contributing entity",freshness:"Confirm lender route and year-end",condition:"Standalone P&L and balance sheet excluded by founder. If required, use controlled exception outside this pack.",basis:"Exception",sources:["WBC","CBA"]},{id:"R09",scenario:"Regular wages from own company",documents:"Eligible salary / ATO income evidence route",period:"Lender-specific; no generic automatic shortcut",quantity:"Confirm eligibility first",freshness:"Current lender rules",condition:"Do not treat a director as ordinary PAYG solely because a payslip exists.",basis:"Exception",sources:["ANZ","CBA-B"]},{id:"R10",scenario:"Partnership or trust income",documents:"Retained entity tax-return/financials bundle + relevant personal evidence",period:"Proposed: 2 latest relevant financial years",quantity:"Per contributing entity; avoid duplicate shared evidence",freshness:"Confirm selected lender age limits",condition:"Trust deed and applicable amendments are separate. Identify borrower / income-provider role; no removed trustee evidence.",basis:"Proposed",sources:["WBC","NAB"]},{id:"R11",scenario:"Eligible streamlined self-employed route",documents:"Route-specific alternatives, potentially personal NOAs",period:"No universal default",quantity:"Do not stack standard and streamlined packs",freshness:"Confirm eligibility against current policy",condition:"Westpac publishes distinct methods. Broker/policy owner verifies eligibility first. The form now previews a mutually exclusive NOA-only or company-wage route; selecting it does not approve it.",basis:"Exception",sources:["WBC"]},{id:"R12",scenario:"Existing rental income",documents:"Approved rental evidence route: statement, lease and/or required supporting evidence",period:"Proposed: latest statement / current lease",quantity:"Selected lender route; one or several items, not a universal OR",freshness:"Current evidence for named property",condition:"Landlord income only; not a tenant ledger. Alternatives are lender-specific: ANZ lists multiple evidence items. Prospective rent and excluded rental appraisals remain separate exceptions.",basis:"Proposed",sources:["CBA","ANZ"]},{id:"R13",scenario:"Purchase with signed contract",documents:"Contract of sale — buying",period:"Current transaction",quantity:"Complete signed contract",freshness:"Current signed version",condition:"Pre-approval without a property must not chase an unavailable contract.",basis:"Proposed",sources:["ANZ","NAB"]},{id:"R14",scenario:"Savings contribute to deposit",documents:"Savings statements",period:"Proposed: 3 continuous months",quantity:"Per contributing savings account",freshness:"Latest available; lender cutoff to confirm",condition:"Not a universal genuine-savings test. Gift letter and sale contract remain separate selected sources.",basis:"Proposed",sources:["HG","ANZ"]},{id:"R15",scenario:"Construction application",documents:"Current-stage contract / plans / schedule, or stage-specific draw evidence",period:"Current project",quantity:"Required project versions",freshness:"Stage and lender determine current / signed / approved requirements",condition:"Select a stage first. Pre-approval does not chase permits or final invoices; progress and final draws generate separate proposed packs. Owner-builder and excluded property-insurance documents need an external broker route.",basis:"Proposed",sources:["WBC-26","ANZ-C"]},{id:"R16",scenario:"Variable income / second job",documents:"Relevant earlier payslips, bonus, overtime or commission evidence",period:"Unresolved by income type and lender",quantity:"Do not assume one generic 3-month pack",freshness:"Unresolved",condition:"Identify employer and income component, then resolve approved evidence route.",basis:"Exception",sources:["ANZ","NAB"]},{id:"R17",scenario:"Government benefit or pension / foreign income",documents:"Government benefit or pension evidence / foreign income evidence",period:"No approved common period",quantity:"Selected income source only",freshness:"Confirm lender and source-specific standard",condition:"Do not reinstate removed translations, annuity or other excluded categories.",basis:"Exception",sources:["CBA","ANZ","NAB"]},{id:"R18",scenario:"First-home buyer, guarantor or other debt",documents:"Selected retained catalogue items",period:"Scheme / liability / lender specific",quantity:"Resolve named requirement, not broad placeholder",freshness:"Current requirement at issue",condition:"First-home buyer is a flag, not a universal extra-document pack. No automatic scheme eligibility decision.",basis:"Exception",sources:[]}],JE=[{id:"P01",step:"purchase-home",title:"Purchase · home to live in",purpose:"Purchase",use:"Owner occupied",documents:"Signed purchase contract when available; evidence of the actual deposit/funds source. Personal income, ID and existing liabilities remain independent.",conditions:"Pre-approval without a contract does not chase it. Savings are conditional on contributing savings. A retained loan is not automatically a refinance.",tags:"purchase-contract; savings-statements only if selected. No subject-property rental tag. Other owned rental properties can still need their own evidence.",review:"First-home buyer/scheme, dwelling type, source of funds and any property being retained or sold.",sources:["ANZ","NAB","CBA"]},{id:"P02",step:"purchase-investment",title:"Purchase · investment",purpose:"Purchase",use:"Investment",documents:"Purchase contract/funding pack plus the approved rental route only if that income is used. Separate existing tenancy from expected future rent.",conditions:"For a tenanted purchase, confirm accessible lease/agent evidence or accepted tenancy details in the contract. Do not request the buyer's pre-ownership rental credits.",tags:"purchase-contract once; selected lease/rental-statements as applicable. Expected future rent creates a broker exception, not an impossible historical-statement chase.",review:"Tenancy status, who can supply the evidence, ongoing accommodation and excluded rental estimate/valuation requirements.",sources:["WBC-26","ANZ","NAB"]},{id:"P03",step:"refinance-home",title:"Refinance · home to live in",purpose:"Refinance",use:"Owner occupied",documents:"Six continuous months for each refinanced home-loan account; proposed rates notice for the named existing security. Income/ID/debts remain independent.",conditions:"A pure refinance does not create a new purchase contract or deposit request. Retained loans use their separate rule; consolidated and retained cards keep their own periods.",tags:"home-loan-statements per required account; rates-notice if selected. Contact tags are recomputed across all requests, not removed on a purpose dropdown change.",review:"Cash-out, debt consolidation, interest-only evidence, security ownership, change of use and broker-managed settlement requirements.",sources:["NAB","CBA","ANZ"]},{id:"P04",step:"refinance-investment",title:"Refinance · investment",purpose:"Refinance",use:"Investment",documents:"Refinance statements and proposed rates notice, plus selected existing-rent evidence. Vacant or
